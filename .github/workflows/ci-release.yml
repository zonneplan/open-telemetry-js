name: 'Release package'

on: workflow_dispatch

permissions:
  id-token: write
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  main:
    name: Release package
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      # Semver creates a tag on the latest commit
      # But the version bump does not create a new commit yet
      # Since the post target needs to sync package versions
      - name: Bump version for packages (synced)
        run: npx nx run version

      - name: Get created tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      # Nothing is pushed until every package is published, so a failed publish
      # leaves the remote untouched and a rerun computes the same version again
      - name: Commit version bump and tag
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          git tag -d "$TAG"
          git add .
          git commit -m "chore(release): bump version to $TAG"
          git tag "$TAG"

      # Order matters for the publishing, packages with dependencies should be published last
      # Versions already on npm (from a partially failed earlier run) are skipped
      - name: Publish packages
        run: |
          for project in open-telemetry-node open-telemetry-nest open-telemetry-zonneplan; do
            spec=$(node -p "const p = require('./packages/$project/package.json'); p.name + '@' + p.version")
            if [ -n "$(npm view "$spec" version 2> /dev/null)" ]; then
              echo "$spec is already published, skipping"
            else
              npx nx run "$project:publish"
            fi
          done

      - name: Push version bump and tag
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: git push --atomic origin HEAD "refs/tags/$TAG"
